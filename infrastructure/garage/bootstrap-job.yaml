apiVersion: batch/v1
kind: Job
metadata:
  name: garage-bootstrap
  namespace: garage
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: dxflrs/amd64_garage:v2.4.1
          command:
            - /bin/sh
            - -ec
            - |
              until garage status; do sleep 5; done

              create_key() {
                garage key info "$1" >/dev/null 2>&1 || garage key import --yes -n "$2" "$1" "$3"
              }
              create_bucket() {
                garage bucket info "$1" >/dev/null 2>&1 || garage bucket create "$1"
              }

              create_key "$CNPG_ACCESS_KEY_ID" cnpg "$CNPG_SECRET_ACCESS_KEY"
              create_key "$LONGHORN_ACCESS_KEY_ID" longhorn "$LONGHORN_SECRET_ACCESS_KEY"
              create_bucket cnpg-backups
              create_bucket longhorn-backups
              garage bucket allow --read --write cnpg-backups --key "$CNPG_ACCESS_KEY_ID"
              garage bucket allow --read --write longhorn-backups --key "$LONGHORN_ACCESS_KEY_ID"
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: adminToken
            - name: CNPG_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: cnpgAccessKeyId
            - name: CNPG_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: cnpgSecretAccessKey
            - name: LONGHORN_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: longhornAccessKeyId
            - name: LONGHORN_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-bootstrap
                  key: longhornSecretAccessKey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/garage
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage-client-config
